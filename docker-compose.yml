version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sportify_postgres
    environment:
      POSTGRES_DB: sportify
      POSTGRES_USER: sportify_user
      POSTGRES_PASSWORD: sportify_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - sportify_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportify_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sportify_user:sportify_password@postgres:5432/sportify
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    networks:
      - sportify_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportify_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - sportify_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  sportify_network:
    driver: bridge
